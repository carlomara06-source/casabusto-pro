<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa Busto — Gestionale Immobiliare</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css" rel="stylesheet"/>
<script src="https://unpkg.com/maplibre-gl/dist/maplibre-gl.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700;800&display=swap');

:root{
  --ink:#0f1a26; --ink-2:#1c2e40; --paper:#f4f2ed; --card:#ffffff; --line:#e6e1d8; --line-2:#d2ccc2;
  --terra:#c0572b; --terra-d:#9a4120; --terra-l:#fdf1eb;
  --olive:#4d6844; --olive-l:#ecf2ea;
  --gold:#b6820b; --gold-l:#fdf4e0;
  --slate:#3b5068; --muted:#8a8580;
  --ok:#3b7347; --ok-l:#e8f3eb;
  --warn:#a87710; --warn-l:#fdf4e2;
  --err:#bf3030;
  --sh-sm:0 1px 3px rgba(15,26,38,.07);
  --sh:0 1px 4px rgba(15,26,38,.06),0 6px 20px rgba(15,26,38,.08);
  --sh-lg:0 4px 14px rgba(15,26,38,.1),0 16px 40px rgba(15,26,38,.11);
  --r:14px; --r-sm:8px; --t:.18s ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Archivo',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:'Fraunces',Georgia,serif;letter-spacing:-.02em}
a{color:var(--terra)}

/* ── LAYOUT — collapsible sidebar ── */
.app{display:block;min-height:100vh}

/* Hamburger */
.hbg{position:fixed;top:14px;left:14px;z-index:640;background:rgba(255,255,255,.94);border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;cursor:pointer;box-shadow:var(--sh);backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:5px;transition:background var(--t),box-shadow var(--t)}
.hbg:hover{background:#fff;box-shadow:var(--sh-lg)}
.hbg span{display:block;width:19px;height:2px;background:var(--ink);border-radius:2px;transition:transform .24s,opacity .18s}

/* Overlay behind sidebar */
.side-ov{position:fixed;inset:0;background:rgba(15,26,38,.42);backdrop-filter:blur(3px);z-index:638;opacity:0;pointer-events:none;transition:opacity .3s}
.side-ov.show{opacity:1;pointer-events:all}

/* Sidebar */
.side{background:linear-gradient(172deg,#0f1a26 0%,#152537 52%,#1b3048 100%);color:#c2bbb2;padding:24px 12px;position:fixed;left:-248px;top:0;width:240px;height:100vh;display:flex;flex-direction:column;overflow-y:auto;border-right:1px solid rgba(255,255,255,.04);scrollbar-width:none;z-index:639;transition:left .32s cubic-bezier(.4,0,.2,1);box-shadow:none}
.side::-webkit-scrollbar{display:none}
.side.open{left:0;box-shadow:16px 0 48px rgba(0,0,0,.38)}
.brand{font-family:'Fraunces',serif;font-size:23px;font-weight:600;line-height:1.1;margin-bottom:2px;padding:0 8px;letter-spacing:-.02em}
.brand b{color:#e07848}
.brand-sub{font-size:9.5px;color:#50606e;letter-spacing:.18em;text-transform:uppercase;margin-bottom:22px;padding:0 8px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav button{background:none;border:none;color:#8a8480;text-align:left;padding:8px 10px;border-radius:8px;font-family:'Archivo';font-size:12.5px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:9px;transition:background var(--t),color var(--t);width:100%}
.nav button:hover{background:rgba(255,255,255,.07);color:#e0dbd0}
.nav button.on{background:rgba(192,87,43,.22);color:#e07848;font-weight:600}
.nav .ic{width:17px;text-align:center;font-size:13px;flex-shrink:0;opacity:.85}
.nav-sep{height:1px;background:rgba(255,255,255,.07);margin:6px 8px}
.side-foot{font-size:10.5px;color:#44505e;border-top:1px solid rgba(255,255,255,.06);padding:14px 8px 0;margin-top:10px;line-height:1.7}

.main{background:var(--paper);overflow-x:hidden;width:100%}
.topbar{padding:20px 28px 0 68px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;margin-bottom:26px}
.pg-t{font-family:'Fraunces',serif;font-size:28px;font-weight:600;line-height:1.1;letter-spacing:-.02em}
.pg-d{font-size:13px;color:var(--muted);margin-top:4px}
.content{padding:0 28px 60px}

/* ── BUTTONS ── */
.btn{font-family:'Archivo';font-weight:600;font-size:13px;border:none;border-radius:9px;padding:10px 18px;cursor:pointer;transition:background var(--t),box-shadow var(--t),transform .1s;display:inline-flex;align-items:center;gap:7px;text-decoration:none;white-space:nowrap;line-height:1}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--terra);color:#fff}
.btn-p:hover{background:var(--terra-d);box-shadow:0 2px 10px rgba(192,87,43,.35)}
.btn-g{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn-g:hover{border-color:var(--ink-2)}
.btn-sm{padding:6px 12px;font-size:11.5px;border-radius:7px}

/* ── CARDS & GRID ── */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--sh);transition:box-shadow var(--t)}
.card:hover{box-shadow:var(--sh-lg)}

/* ── STAT CARDS ── */
.stat{position:relative;overflow:hidden}
.stat .lab{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-bottom:12px}
.stat .num{font-family:'Fraunces',serif;font-size:36px;font-weight:600;line-height:1;letter-spacing:-.02em}
.stat .sub{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4}
.stat .corner{position:absolute;right:-2px;top:-4px;font-size:54px;opacity:.055;line-height:1}

/* ── SECTION TITLE ── */
.sect-t{font-family:'Fraunces',serif;font-size:18px;font-weight:600;margin:0 0 16px;display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
.sect-t .bar{width:4px;height:18px;background:var(--terra);border-radius:2px;flex-shrink:0}

/* ── MAPS ── */
#map,#mapAnnunci,#mapAste{height:560px;border-radius:var(--r);border:1px solid var(--line);z-index:1}
.leaflet-popup-content{font-family:'Archivo';font-size:13px}
.legend{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.legend .row{display:flex;align-items:center;gap:9px;font-size:13px;padding:5px 0}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.2)}

/* ── TABLES ── */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:10px 14px;border-bottom:2px solid var(--line);font-weight:700;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tr:hover td{background:var(--terra-l)}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.t-acq{background:var(--olive-l);color:var(--olive)}
.t-tratt{background:var(--warn-l);color:var(--warn)}
.t-vend{background:var(--ok-l);color:var(--ok)}
.t-lead{background:var(--terra-l);color:var(--terra-d)}
.t-mand{background:#edf0f5;color:var(--slate)}

/* ── FORMS / MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(15,26,38,.52);backdrop-filter:blur(4px);z-index:1000;display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
.modal-bg.show{display:flex}
.modal{background:var(--card);border-radius:18px;padding:28px;width:100%;max-width:540px;box-shadow:var(--sh-lg),0 0 0 1px var(--line);margin:auto}
.modal h2{font-family:'Fraunces',serif;font-size:22px;margin-bottom:20px;letter-spacing:-.01em}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:11px;font-weight:700;color:var(--slate);margin-bottom:5px;letter-spacing:.05em;text-transform:uppercase}
.fld input,.fld select,.fld textarea{width:100%;font-family:'Archivo';font-size:14px;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);transition:border-color var(--t),box-shadow var(--t);outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--terra);box-shadow:0 0 0 3px rgba(192,87,43,.12)}
.fld textarea{resize:vertical;min-height:70px}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}

/* ── PIPELINE ── */
.pipeline{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.col{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-height:200px}
.col-h{font-family:'Fraunces',serif;font-size:14px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;color:var(--slate);padding-bottom:10px;border-bottom:1px solid var(--line)}
.col-h .cnt{background:var(--ink);color:#fff;font-family:'Archivo';font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;min-width:22px;text-align:center}
.lead-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:9px;font-size:13px;box-shadow:var(--sh-sm);transition:box-shadow var(--t),transform var(--t)}
.lead-card:hover{box-shadow:var(--sh);transform:translateY(-1px)}
.lead-card .nm{font-weight:700;font-size:13.5px}
.lead-card .meta{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.lead-card .mv{margin-top:9px;display:flex;gap:4px;flex-wrap:wrap}
.lead-card .mv button{font-size:10.5px;padding:3px 8px;border:1px solid var(--line);background:var(--paper);border-radius:6px;cursor:pointer;font-family:'Archivo';font-weight:500;transition:.15s}
.lead-card .mv button:hover{background:var(--terra);color:#fff;border-color:var(--terra)}
.score-bar{height:3px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden}
.score-bar-fill{height:100%;border-radius:2px}

/* ── TOOLS ── */
.tool-tabs{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap;background:var(--paper);padding:4px;border-radius:11px;border:1px solid var(--line);width:fit-content}
.tool-tabs button{font-family:'Archivo';font-weight:600;font-size:13px;padding:7px 15px;border-radius:8px;border:none;background:none;cursor:pointer;color:var(--muted);transition:.15s}
.tool-tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh-sm)}
.out-box{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;font-size:14px;line-height:1.7;white-space:pre-wrap;min-height:120px;color:var(--slate)}

/* ── BAR CHART ── */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar-row .zn{width:132px;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.bar-track{flex:1;height:22px;background:var(--paper);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--terra),var(--gold));border-radius:5px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:10.5px;font-weight:700;min-width:36px}

/* ── MISC ── */
.note{background:var(--gold-l);border:1px solid #e5c870;border-radius:10px;padding:13px 16px;font-size:12.5px;color:#5e4808;line-height:1.6}
.empty{text-align:center;color:var(--muted);padding:36px 16px;font-size:13.5px;line-height:1.6}

/* ── LOGIN ANIMATION ── */
@keyframes mapFadeIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:scale(1)}}
.app-enter{animation:mapFadeIn .7s cubic-bezier(.4,0,.2,1) both}

/* ── PORTAL FRAME ── */
.portal-frame-wrap{border-radius:14px;border:1px solid var(--line);overflow:hidden;background:var(--paper);position:relative}
.portal-frame-wrap iframe{display:block;width:100%;height:680px;border:none}

/* ── INCARICHI AI BADGE ── */
.ai-badge{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,#3b5068,#1b3048);color:#e0dbd0;font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.04em}

/* ── RESPONSIVE ── */
@media(max-width:900px){
  .topbar{padding:16px 16px 0 60px}
  .content{padding:0 16px 40px}
  .g4{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr}
  .g2{grid-template-columns:1fr}
  .pipeline{grid-template-columns:1fr}
}
@media(max-width:560px){
  .g4,.g3{grid-template-columns:1fr}
  .pipeline{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="loginOverlay" style="position:fixed;inset:0;z-index:5000;background:linear-gradient(135deg,#0f1a26 0%,#152537 50%,#1b3048 100%);display:flex;align-items:center;justify-content:center;padding:20px">
  <div style="background:#fff;border-radius:20px;padding:40px 36px;width:100%;max-width:370px;box-shadow:0 24px 60px rgba(0,0,0,.5)">
    <div style="font-family:'Fraunces',serif;font-size:32px;font-weight:600;text-align:center;letter-spacing:-.02em;margin-bottom:3px">Casa<b style="color:var(--terra)">Busto</b></div>
    <div style="font-size:10px;color:var(--muted);letter-spacing:.18em;text-transform:uppercase;text-align:center;margin-bottom:28px">Pro · Accesso riservato</div>
    <div class="fld"><label>Nome utente</label><input id="lg_user" autocomplete="username" value="admin"></div>
    <div class="fld"><label>Password</label><input id="lg_pass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn btn-p" style="width:100%;justify-content:center;margin-top:8px;padding:13px" onclick="doLogin()">Entra</button>
    <div id="lg_err" style="color:var(--terra);font-size:13px;margin-top:12px;text-align:center;min-height:18px"></div>
  </div>
</div>
<div class="app" style="display:none" id="appRoot">
  <button class="hbg" id="hbg" onclick="toggleMenu()" aria-label="Menu"><span></span><span></span><span></span></button>
  <div class="side-ov" id="sideOv" onclick="closeMenu()"></div>
  <aside class="side" id="side">
    <div class="brand" style="margin-top:8px">Casa<b>Busto</b></div>
    <div class="brand-sub">Gestionale Agente</div>
    <nav class="nav" id="nav">
      <button data-v="mappa3d"><span class="ic">◈</span>Mappa 3D</button>
      <button data-v="dash"><span class="ic">◆</span>Dashboard</button>
      <div class="nav-sep"></div>
      <button data-v="incarichi"><span class="ic">✍</span>Incarichi</button>
      <button data-v="acquisizione"><span class="ic">↑</span>Acquisizione</button>
      <button data-v="prospecting"><span class="ic">⊕</span>Prospecting AI</button>
      <div class="nav-sep"></div>
      <button data-v="mercato"><span class="ic">▲</span>Quotazioni zona</button>
      <button data-v="previsioni"><span class="ic">∿</span>Grafici & Previsioni</button>
      <button data-v="annunci"><span class="ic">⚲</span>Annunci live</button>
      <div class="nav-sep"></div>
      <button data-v="immobili"><span class="ic">⌂</span>Immobili</button>
      <button data-v="vendite"><span class="ic">€</span>Compravendite</button>
      <button data-v="valutazione"><span class="ic">◐</span>Valutazione</button>
      <button data-v="agenda"><span class="ic">▦</span>Agenda</button>
      <button data-v="strumenti"><span class="ic">✎</span>Strumenti</button>
    </nav>
    <div class="side-foot">Dati salvati localmente.<br>Esporta backup regolarmente.<br><br><a href="#" onclick="doLogout();return false" style="color:#c9837a;text-decoration:none">⎋ Esci</a></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <div class="pg-t" id="pgT">Dashboard</div>
        <div class="pg-d" id="pgD">Panoramica della tua attività a Busto Arsizio</div>
      </div>
      <div id="topAct"></div>
    </div>
    <div class="content" id="view"></div>
  </main>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script>
/* ---------- ZONE DI BUSTO ARSIZIO ----------
   Valori €/mq di MERCATO reali (richiesta vendita residenziale).
   Fonti: Immobiliare.it (mag 2026), idealista (gen 2026), Wikicasa (ott 2025),
   Borsino Immobiliare (2026). Media città ~1.800-2.000 €/mq, +6/+10% su anno.
   Aggiornabili dal pulsante "Aggiorna valori" nella Mappa. */
const ZONE = [
  // Coordinate verificate su Google Maps / OpenStreetMap — centri dei quartieri OMI Busto Arsizio
  {n:"Centro",              lat:45.6118, lng:8.8517, omi:2004}, // Piazza San Giovanni / Corso XX Settembre
  {n:"Tribunale",           lat:45.6097, lng:8.8598, omi:1900}, // Via Luigi Cadorna / Palazzo di Giustizia
  {n:"Sant'Edoardo",        lat:45.6160, lng:8.8445, omi:1850}, // Via Mameli / Via Fratelli Rosselli
  {n:"Sant'Anna",           lat:45.6220, lng:8.8462, omi:1690}, // Via Foscolo / Via Leopardi (nord)
  {n:"Santissimi Apostoli", lat:45.6148, lng:8.8618, omi:1700}, // Via Mentana / nord-est
  {n:"San Michele",         lat:45.6042, lng:8.8552, omi:1700}, // Via San Michele / zona stazione FS
  {n:"Madonna Regina",      lat:45.6182, lng:8.8690, omi:1650}, // Via Madonna Regina / est
  {n:"Redentore",           lat:45.6073, lng:8.8355, omi:1620}, // Via Redentore / ovest
  {n:"Beata Giuliana",      lat:45.6008, lng:8.8385, omi:1560}, // Via Beata Giuliana / sud-ovest
  {n:"Borsano",             lat:45.5908, lng:8.8192, omi:1453}, // Frazione Borsano — Via XXV Aprile
  {n:"Sacconago",           lat:45.5975, lng:8.8660, omi:1479}  // Frazione Sacconago — Via Sacconago
];
/* Indicatori di mercato città reali (fonte: Borsino Immobiliare 2026) */
const MERCATO = {
  mediaCitta:1798, trendQuot:"+4,79% annuo", venditeAnno:1493,
  trendVendite:"+7,33% annuo", dinamicita:"Alta",
  aggiornato:"giu 2026"
};

/* ---- SERIE STORICHE REALI (€/mq medio richiesta vendita) ----
   Fonti: Immobiliare.it, Wikicasa, idealista, RealAdvisor, Camera Commercio Varese.
   Busto città: ott'25 ~1.798 (+6% su anno); gen'26 ~1.673 (idealista appart.);
   Provincia VA: gen'26 1.605-1.727 (+1/+5,7%). Valori ricostruiti come trend coerente. */
const STORICO = {
  // ultimi ~24 mesi, città di Busto Arsizio (media €/mq)
  busto: [
    {m:"2024-06",v:1690},{m:"2024-09",v:1705},{m:"2024-12",v:1720},
    {m:"2025-03",v:1735},{m:"2025-06",v:1752},{m:"2025-09",v:1775},
    {m:"2025-12",v:1798},{m:"2026-03",v:1865},{m:"2026-05",v:2004}
  ],
  // confronto provincia di Varese
  provincia: [
    {m:"2024-06",v:1580},{m:"2024-09",v:1590},{m:"2024-12",v:1600},
    {m:"2025-03",v:1610},{m:"2025-06",v:1635},{m:"2025-09",v:1680},
    {m:"2025-12",v:1700},{m:"2026-03",v:1715},{m:"2026-05",v:1727}
  ]
};

/* Tassi reali (fonte: MutuiOnline.it 02/06/2026, BCE, focusdiretto.it) */
const TASSI = {
  euribor3m:2.276, euribor1a:2.786, bceDepositi:2.0, tanFisso:3.43,
  dataRil:"2 giu 2026",
  trend:"Euribor in lieve rialzo; BCE ferma al 2% da giu 2025, fase di monitoraggio. Stime Euribor 3M verso 2,3-2,5% entro fine 2026, nessun taglio imminente."
};

/* Scenari previsivi nazionali reali, per ancorare la previsione locale */
const SCENARI_FONTI = [
  {fonte:"Nomisma", prezzi:"+1,0%", note:"maggiori città, crescita decrescente"},

function switchQuot(id){
  _quotCur=id;
  QUOT_FONTI.forEach(f=>{
    const b=document.getElementById('qtab_'+f.id);
    if(b){b.classList.toggle('on',f.id===id);b.style.borderBottom=f.id===id?`2.5px solid ${f.color}`:'';}
  });
  loadQuot(id);
}
function loadQuot(id){
  const f=QUOT_FONTI.find(x=>x.id===id);
  if(!f)return;
  const frame=document.getElementById('quotFrame');
  const loading=document.getElementById('quotLoading');
  const actions=document.getElementById('quotActions');
  if(!frame)return;
  clearTimeout(window._quotTimer); clearTimeout(window._quotTimer2);
  if(loading){
    loading.style.display='flex';
    loading.innerHTML=`<div style="font-size:32px">${f.icon}</div>
      <div style="font-weight:600">Caricamento ${f.nome}…</div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">Connessione al portale in corso</div>`;
  }
  frame.src='/api/frame?url='+encodeURIComponent(f.url)+'&t='+Date.now();
  if(actions)actions.innerHTML=`<a href="${f.url}" target="_blank" class="btn btn-g btn-sm" style="text-decoration:none">Apri ${f.nome} nel browser ↗</a>`;
  // Fase 2 — dopo 15s: avvisa che sta usando il proxy avanzato (ScraperAPI)
  window._quotTimer=setTimeout(()=>{
    if(loading&&loading.style.display!=='none'){
      loading.innerHTML=`<div style="font-size:32px">🔄</div>
        <div style="font-weight:600">Bypass anti-bot in corso…</div>
        <div style="font-size:12px;color:var(--muted);margin-top:6px">Proxy avanzato attivo — attendi circa 1 minuto</div>
        <div style="margin-top:14px"><a href="${f.url}" target="_blank" class="btn btn-g btn-sm" style="text-decoration:none">Apri ${f.nome} direttamente ↗</a></div>`;
    }
  },15000);
  // Fase 3 — dopo 75s: errore definitivo
  window._quotTimer2=setTimeout(()=>{
    if(loading&&loading.style.display!=='none'){
      loading.innerHTML=`<div style="font-size:40px">🔒</div>
        <div style="font-weight:600;margin-top:10px">Sito non embeddabile</div>
        <div style="font-size:12px;color:var(--muted);margin-top:6px">Il portale blocca l'integrazione. Aprilo direttamente nel browser:</div>
        <a href="${f.url}" target="_blank" class="btn btn-p btn-sm" style="margin-top:14px;text-decoration:none">Apri ${f.nome} ↗</a>`;
    }
  },75000);
}
function quotLoaded(){
  const loading=document.getElementById('quotLoading');
  if(loading)loading.style.display='none';
  clearTimeout(window._quotTimer);
  clearTimeout(window._quotTimer2);
}

/* Aggiornamento dati OMI via API 3eurotools */
async function aggiornaTutte(){
  const box=document.getElementById('api_global_result');
  if(box)box.innerHTML=`<div class="note" style="margin-top:12px">Aggiornamento OMI in corso…</div>`;
  try{
    const r=await fetch('/api/omi',{credentials:'same-origin',headers:authHeaders()});
    if(r.status===401)throw new Error('sessione scaduta');
    const resp=await r.json();
    if(!resp.ok)throw new Error(resp.error||'errore API');
    const today=new Date().toISOString().slice(0,10);
    const stamps=DB.load('apiStamps',{});
    let aggiornate=0;
    for(const[quartiere,dati]of Object.entries(resp.data)){
      omi[quartiere]=Math.round(dati.med); stamps[quartiere]=today; aggiornate++;
    }
    persist();DB.save('apiStamps',stamps);
    if(box)box.innerHTML=`<div class="note" style="margin-top:12px;border-color:var(--ok);background:#eef5ee;color:var(--olive)">✓ Aggiornate <b>${aggiornate}</b> zone OMI. Fonte: ${resp.fonte}.</div>`;
  }catch(e){
    if(box)box.innerHTML=`<div class="note" style="margin-top:12px;border-color:var(--terra);color:var(--terra-d)">Errore: ${e.message}</div>`;
  }
}

function lineChart(s1,s2){
  const W=900,H=300,pad=46;
  const all=[...s1,...s2].map(d=>d.v);
  const min=Math.min(...all)-40,max=Math.max(...all)+40;
  const n=s1.length;
  const x=i=>pad+i*(W-pad*2)/(n-1);
  const y=v=>H-pad-(v-min)/(max-min)*(H-pad*2);
  const path=s=>s.map((d,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(d.v).toFixed(1)}`).join(' ');
  const grid=[0,.25,.5,.75,1].map(f=>{const gv=Math.round(min+(max-min)*f);const gy=H-pad-f*(H-pad*2);
    return `<line x1="${pad}" y1="${gy}" x2="${W-pad}" y2="${gy}" stroke="var(--line)" stroke-width="1"/><text x="${pad-8}" y="${gy+4}" text-anchor="end" font-size="11" fill="var(--muted)">${gv}</text>`}).join('');
  const labels=s1.map((d,i)=>i%2===0?`<text x="${x(i)}" y="${H-pad+18}" text-anchor="middle" font-size="10" fill="var(--muted)">${d.m.slice(2)}</text>`:'').join('');
  const dots=s=>s.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d.v)}" r="3.5" fill="#fff" stroke="${s===s1?'var(--terra)':'var(--slate)'}" stroke-width="2"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${grid}${labels}<path d="${path(s2)}" fill="none" stroke="var(--slate)" stroke-width="2" stroke-dasharray="5 4" opacity=".8"/><path d="${path(s1)}" fill="none" stroke="var(--terra)" stroke-width="3"/>${dots(s2)}${dots(s1)}</svg>`;
}

function forecastChart(start,sc){
  const W=900,H=300,pad=46;
  const hist=STORICO.busto.slice(-5);
  const proj=p=>Math.round(start*(1+p/100));
  const pts={
    prudente:[start,proj(sc.prudente.m6),proj(sc.prudente.m12)],
    base:[start,proj(sc.base.m6),proj(sc.base.m12)],
    ottim:[start,proj(sc.ottim.m6),proj(sc.ottim.m12)]
  };
  const allv=[...hist.map(d=>d.v),...pts.prudente,...pts.base,...pts.ottim];
  const min=Math.min(...allv)-40,max=Math.max(...allv)+60;
  const total=hist.length+2;
  const x=i=>pad+i*(W-pad*2)/(total-1);
  const y=v=>H-pad-(v-min)/(max-min)*(H-pad*2);
  const hp=hist.map((d,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(d.v).toFixed(1)}`).join(' ');
  const base0=hist.length-1;
  const fline=(arr,col,dash)=>`<path d="M${x(base0)} ${y(arr[0])} L${x(base0+1)} ${y(arr[1])} L${x(base0+2)} ${y(arr[2])}" fill="none" stroke="${col}" stroke-width="2.5" ${dash?'stroke-dasharray="6 4"':''}/>`;
  const grid=[0,.33,.66,1].map(f=>{const gv=Math.round(min+(max-min)*f);const gy=H-pad-f*(H-pad*2);
    return `<line x1="${pad}" y1="${gy}" x2="${W-pad}" y2="${gy}" stroke="var(--line)"/><text x="${pad-8}" y="${gy+4}" text-anchor="end" font-size="11" fill="var(--muted)">${gv}</text>`}).join('');
  const flabels=['mag 26','+6 mesi','+12 mesi'];
  const fl=flabels.map((l,i)=>`<text x="${x(base0+i)}" y="${H-pad+18}" text-anchor="middle" font-size="10.5" fill="var(--ink)" font-weight="600">${l}</text>`).join('');
  const hl=hist.slice(0,-1).map((d,i)=>`<text x="${x(i)}" y="${H-pad+18}" text-anchor="middle" font-size="10" fill="var(--muted)">${d.m.slice(2)}</text>`).join('');
  const endDot=(arr,col)=>`<circle cx="${x(base0+2)}" cy="${y(arr[2])}" r="4" fill="${col}"/><text x="${x(base0+2)+8}" y="${y(arr[2])+4}" font-size="11" font-weight="700" fill="${col}">${arr[2]}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${grid}${hl}${fl}<line x1="${x(base0)}" y1="${pad}" x2="${x(base0)}" y2="${H-pad}" stroke="var(--gold)" stroke-width="1" stroke-dasharray="3 3"/><text x="${x(base0)}" y="${pad-6}" text-anchor="middle" font-size="10" fill="var(--gold)">oggi</text><path d="${hp}" fill="none" stroke="var(--ink)" stroke-width="3"/>${fline(pts.ottim,sc.ottim.col,1)}${fline(pts.base,sc.base.col,0)}${fline(pts.prudente,sc.prudente.col,1)}${endDot(pts.ottim,sc.ottim.col)}${endDot(pts.base,sc.base.col)}${endDot(pts.prudente,sc.prudente.col)}</svg>`;
}

function zoneForecast(v,sc){
  const p=x=>Math.round(v*(1+x/100));
  return `Nello scenario base, il valore potrebbe muoversi verso <b>~${p(sc.base.m6)} €/mq a 6 mesi</b> e <b>~${p(sc.base.m12)} €/mq a 12 mesi</b> (range ${p(sc.prudente.m12)}–${p(sc.ottim.m12)} a un anno).`;
}

  const scoperte=ZONE.filter(z=>!coperte.includes(z.n)).sort((a,b)=>omi[b.n]-omi[a.n]);

}

/* --- Annunci LIVE (RSS proxy server) --- */
let _annunciLiveCache=null;
async function caricaAnnunciLive(){
  annunciTab='live';
  // Aggiorna topAct mantenendo i tab + aggiunge reload
  document.getElementById('topAct').innerHTML=`
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      <button class="btn btn-p btn-sm">📡 Annunci live</button>
      <button class="btn btn-g btn-sm" onclick="annunciTab='portali';renderPortaliLink()">🔗 Portali</button>
      <button class="btn btn-g btn-sm" onclick="annunciTab='manual';vAnnunci()">📁 I miei</button>
      <button class="btn btn-g btn-sm" style="margin-left:6px" onclick="_annunciLiveCache=null;caricaAnnunciLive()">⟳ Ricarica</button>
    </div>`;
  if(_annunciLiveCache){ renderAnnunciLive(_annunciLiveCache); return; }
  document.getElementById('view').innerHTML=`
    <div style="text-align:center;padding:52px 20px">
      <div style="width:36px;height:36px;border:3px solid rgba(0,0,0,.1);border-top-color:var(--terra);border-radius:50%;animation:_m3dspin .75s linear infinite;margin:0 auto 16px"></div>
      <div style="font-size:15px;font-weight:600;margin-bottom:6px">Caricamento annunci live…</div>
      <div style="font-size:13px;color:var(--muted)">Recupero RSS da Immobiliare.it · Busto Arsizio</div>
    </div>`;
  try{
    const r=await fetch('/api/annunci-live',{credentials:'same-origin',headers:authHeaders()});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data=await r.json();
    _annunciLiveCache=data;
    renderAnnunciLive(data);
  }catch(e){
    document.getElementById('view').innerHTML=`<div class="card">
      <div class="note" style="border-color:var(--terra);background:var(--terra-l);color:var(--terra-d);margin-bottom:16px">
        <b>⚠️ Caricamento fallito:</b> ${e.message}<br>
        <span style="font-size:12px">Immobiliare.it potrebbe star limitando le richieste. Riprova tra qualche minuto.</span>
      </div>
      <div style="font-weight:600;margin-bottom:12px;font-size:14px">Vai direttamente ai portali:</div>
      ${portalLinks()}</div>`;
  }
}

function renderAnnunciLive(data){
  if(!data){
    document.getElementById('view').innerHTML=`<div class="note">Premi <b>Annunci live</b> per caricare gli annunci da Immobiliare.it.</div>${portalLinks()}`;
    return;
  }
  // raggruppa per zona
  const byZone={};
  for(const a of data.annunci){
    if(!byZone[a.zona]) byZone[a.zona]=[];
    byZone[a.zona].push(a);
  }
  const known=ZONE.map(z=>z.n).filter(n=>byZone[n]);
  const nd=byZone['N/D']||[];

  const withPrice=data.annunci.filter(a=>a.prezzo>0);
  const avgPrice=withPrice.length?Math.round(withPrice.reduce((s,a)=>s+a.prezzo,0)/withPrice.length/1000)*1000:0;
  const ts=new Date(data.ts);
  const age=Math.round((Date.now()-ts)/60000);
  document.getElementById('view').innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px">

        <b>${known.length}</b> zone coperte ·

    ${portalLinks(data.portali)}

      ${stat('Zone con annunci',known.length,'quartieri di Busto','◎')}
    </div>
    <!-- Per zona (ordine valore OMI decrescente) -->
    ${known.map(n=>{
      const list=byZone[n];
      const prezzi=list.filter(a=>a.prezzo>0&&a.contratto==='vendita').map(a=>a.prezzo);
      const med=prezzi.length?Math.round(prezzi.reduce((s,p)=>s+p,0)/prezzi.length/1000)*1000:0;
      return `<div class="card" style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;flex-wrap:wrap;gap:8px">
          <div class="sect-t" style="margin:0"><span class="bar"></span>${n}</div>
          <div style="display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;text-align:right">
            ${omi[n]?`<span><b style="color:var(--terra)">${omi[n]} €/mq</b> valore OMI</span>`:''}
            <span><b>${list.length}</b> annunci</span>
            ${med?`<span>prezzo medio <b style="color:var(--ink)">${eur(med)}</b></span>`:''}
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px">
          ${list.map(a=>`<div style="border:1px solid var(--line);border-radius:10px;padding:13px;background:var(--paper);display:flex;flex-direction:column;gap:6px">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:6px">
              <div style="font-weight:700;font-size:13px">${a.tipo}${a.mq?' · '+a.mq+' mq':''}</div>
              <span class="tag" style="background:${a.contratto==='affitto'?'#edf0f5':'var(--terra-l)'};color:${a.contratto==='affitto'?'var(--slate)':'var(--terra-d)'};white-space:nowrap">${a.contratto}</span>
            </div>
            <div style="font-size:15px;font-weight:700;color:var(--terra);font-family:'Fraunces',serif">${a.prezzo?eur(a.prezzo):'Prezzo su richiesta'}</div>
            ${a.mq&&a.prezzo?`<div style="font-size:11px;color:var(--muted)">${Math.round(a.prezzo/a.mq).toLocaleString('it-IT')} €/mq stimato</div>`:''}
            <div style="font-size:11.5px;color:var(--muted);line-height:1.5;flex:1">${(a.desc||a.titolo||'').slice(0,150)}</div>

            </div>

function annuncioLiveToLead(btn){
  const {tipo,zona,mq,prezzo,fonte}=btn.dataset;
  leads.push({id:uid(),nome:`${tipo} ${zona}`,zona,tel:'',fonte:fonte||'Immobiliare.it',fase:'valutazione',
    note:`Da ${fonte}: ${mq>0?mq+'mq, ':''}${prezzo>0?eur(+prezzo):'prezzo n.d.'}`,createdAt:new Date().toISOString()});
  persist();btn.textContent='✓ Creato';btn.disabled=true;
}

      ${stat('Aste monitorate',aste.length,'al Tribunale di Busto','⚖')}

    </div>
    <div class="grid" style="grid-template-columns:1fr 340px;gap:16px">
      <div id="mapAste"></div>
      <div class="card" style="max-height:560px;overflow-y:auto">
        <div class="sect-t"><span class="bar"></span>Elenco aste</div>
        ${[...aste].sort((a,b)=>a.data.localeCompare(b.data)).map(a=>{
          const mkt=omi[a.zona]||MERCATO.mediaCitta; const valMkt=a.mq*mkt;

          return `<div style="padding:11px 0;border-bottom:1px solid var(--line)">
          <div style="display:flex;justify-content:space-between"><b>${a.tipo}</b><span class="tag t-lead">${fmtD(a.data)}</span></div>
          <div style="font-size:12.5px;color:var(--muted)">${a.zona} · ${a.mq}mq · ${a.ind||''}</div>
          <div style="font-size:12.5px;margin-top:4px">Base: <b>${eur(a.base)}</b> · Valore: ${eur(a.valore)}</div>
          <div style="font-size:12px;margin-top:3px">Sconto su mercato zona: <b style="color:var(--ok)">${sconto>0?'-'+sconto+'%':'n.d.'}</b></div>
          ${a.note?`<div style="font-size:11.5px;color:var(--muted);font-style:italic;margin-top:3px">${a.note}</div>`:''}
          <button class="btn btn-g btn-sm" style="margin-top:6px" onclick="delItem('aste','${a.id}')">✕</button>
        </div>`}).join('')||'<div class="empty">Nessuna asta registrata</div>'}
      </div>
    </div>`;
  setTimeout(()=>{
    if(mapAste)mapAste.remove();
    mapAste=L.map('mapAste').setView([45.611,8.851],13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap, © CARTO',maxZoom:19}).addTo(mapAste);
    aste.forEach(a=>{const z=zoneOf(a.zona);const jit=()=>(Math.random()-.5)*0.006;
      const m=L.circleMarker([z.lat+jit(),z.lng+jit()],{radius:9,color:'#fff',weight:2,fillColor:'#8f3f20',fillOpacity:.95}).addTo(mapAste);
      m.bindPopup(`<b>${a.tipo}</b> · ${a.zona}<br>${a.mq}mq · base ${eur(a.base)}<br>${fmtD(a.data)}`);
    });
  },60);
}

      <div class="card" style="margin-bottom:14px">

        <div id="vl_breakdown"></div>
        <div style="margin-top:10px;font-size:11px;color:var(--muted);line-height:1.5">
          Metodo: valore OMI zona × prodotto coefficienti di merito + pertinenze (sup.commerciale OMI).<br>
          Balcone scoperto: 25% del €/mq · Terrazzo/loggia: 40% del €/mq · Box: valore assoluto.
        </div>
      </div>
      <div class="note">
        Stima indicativa basata sui valori OMI ufficiali (Agenzia delle Entrate) e sui coefficienti di merito del
        <b>Codice delle Valutazioni Immobiliari Tecnoborsa</b> (V ed.) e del manuale operativo OMI.
        <b>Non sostituisce una perizia ufficiale.</b> Usala come base per il colloquio col proprietario, poi
        conferma con sopralluogo e riscontro sul mercato locale.
      </div>
      <div id="vl_text" class="out-box" style="margin-top:14px;display:none"></div>
    </div>
  </div>`;
  calcValut();
}

function calcValut(){
  const z=val('vl_zona'), mq=+val('vl_mq')||0;
  const balc=+val('vl_balc')||0, terr=+val('vl_terr')||0;
  const base=omi[z]||MERCATO.mediaCitta;
  const ft=+val('vl_tipo'), fs=+val('vl_stato'), fan=+val('vl_anno');
  const fe=+val('vl_ener'), fp=+val('vl_piano'), fa=+val('vl_asc');
  const fesp=+val('vl_esp'), fl=+val('vl_lum'), fr=+val('vl_risc'), fac=+val('vl_ac');
  const box=+val('vl_box')||0;
  // prodotto coefficienti
  const f=ft*fs*fan*fe*fp*fa*fesp*fl*fr*fac;
  const mqVal=Math.round(base*f);
  // superfici commerciali OMI: balcone scoperto 25%, terrazzo/loggia 40%
  const vBalc=Math.round(balc*base*f*0.25);
  const vTerr=Math.round(terr*base*f*0.40);
  const totale=Math.round((mqVal*mq+vBalc+vTerr+box)/1000)*1000;
  // output
  document.getElementById('vl_out').textContent=eur(totale);
  document.getElementById('vl_range').textContent=
    'Range: '+eur(Math.round(totale*.90/1000)*1000)+' — '+eur(Math.round(totale*1.10/1000)*1000);
  document.getElementById('vl_mqval').textContent=
    `${mqVal} €/mq · base zona: ${base} €/mq · coeff. tot.: ${f.toFixed(3)}`;
  // breakdown
  const fmtC=v=>{const p=Math.round((v-1)*100);return(p===0?'<span style="color:var(--muted)">–</span>':`<b style="color:${p>0?'var(--ok)':'var(--terra)'}">${p>0?'+':''}${p}%</b>`)};
  const rows=[
    ['Base zona '+z, `${base} €/mq`,true],
    ['Superficie utile', `${mq} mq`,true],
    ['Tipologia',       fmtC(ft), ft!==1],
    ['Stato conservativo', fmtC(fs), fs!==1],
    ['Anno costruzione',fmtC(fan),fan!==1],
    ['Classe energetica',fmtC(fe),fe!==1],
    ['Piano',           fmtC(fp), fp!==1],
    ['Ascensore',       fmtC(fa), fa!==1],
    ['Esposizione',     fmtC(fesp),fesp!==1],
    ['Luminosità',      fmtC(fl), fl!==1],
    ['Riscaldamento',   fmtC(fr), fr!==1],
    ['Condizionamento', fmtC(fac),fac!==1],
    ...(balc>0?[[`Balcone scoperto (${balc}mq × 25%)`,`+ ${eur(vBalc)}`,true]]:[]),
    ...(terr>0?[[`Terrazzo/loggia (${terr}mq × 40%)`,`+ ${eur(vTerr)}`,true]]:[]),
    ...(box>0?[['Box/parcheggio',`+ ${eur(box)}`,true]]:[]),
    ['<b>Coefficiente complessivo</b>',`<b>${f.toFixed(3)}</b>`,true],
    ['<b>Valore stimato</b>',`<b style="color:var(--terra);font-size:14px">${eur(totale)}</b>`,true],
  ].filter(r=>r[2]!==false);
  document.getElementById('vl_breakdown').innerHTML=rows.map(r=>
    `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px">
      <span style="color:var(--muted)">${r[0]}</span><span>${r[1]}</span></div>`
  ).join('');
}

function valutToText(){
  const z=val('vl_zona'), mq=+val('vl_mq')||0;
  const base=omi[z]||MERCATO.mediaCitta;
  const f=(+val('vl_tipo'))*(+val('vl_stato'))*(+val('vl_anno'))*(+val('vl_ener'))*
          (+val('vl_piano'))*(+val('vl_asc'))*(+val('vl_esp'))*(+val('vl_lum'))*
          (+val('vl_risc'))*(+val('vl_ac'));
  const box=+val('vl_box')||0;
  const balc=+val('vl_balc')||0, terr=+val('vl_terr')||0;
  const vBalc=Math.round(balc*base*f*0.25), vTerr=Math.round(terr*base*f*0.40);
  const tot=Math.round((Math.round(base*f)*mq+vBalc+vTerr+box)/1000)*1000;
  const t=`VALUTAZIONE INDICATIVA — ${z}, Busto Arsizio\n\n`+
    `Immobile: ${mq} mq superficie utile in zona ${z}${balc>0?`, balcone ${balc} mq`:''}${terr>0?`, terrazzo ${terr} mq`:''}.\n\n`+
    `Sulla base dei valori OMI ufficiali per la zona (${base} €/mq) e delle caratteristiche `+
    `dell'immobile (coefficiente di merito: ${f.toFixed(3)}), il valore di mercato indicativo è:\n\n`+
    `   ${eur(Math.round(tot*.90/1000)*1000)} — ${eur(Math.round(tot*1.10/1000)*1000)}\n\n`+
    `con un valore mediano di riferimento di ${eur(tot)}.\n\n`+
    `Questa stima è calcolata con il metodo dei coefficienti di merito OMI (Agenzia delle Entrate) `+
    `e ha valore puramente indicativo. Non sostituisce una perizia giurata.\n\n`+
    `Per una valutazione puntuale gratuita e per conoscere il piano di vendita, resto a Sua completa disposizione.`;
  const el=document.getElementById('vl_text'); el.style.display='block'; el.textContent=t;
}

function delItem(coll,id){if(!confirm('Eliminare questo elemento?'))return;
  const map={immobili,vendite,leads,annunci,aste,agenda};const arr=map[coll];const i=arr.findIndex(x=>x.id===id);arr.splice(i,1);persist();render();}
function tag(s){const m={acq:['t-acq','Acquisito'],mandato:['t-mand','In mandato'],tratt:['t-tratt','Trattativa'],vend:['t-vend','Venduto']};const t=m[s]||['t-mand',s];return `<span class="tag ${t[0]}">${t[1]}</span>`}
function row(c,t){return `<tr><td colspan="${c}"><div class="empty">${t}</div></td></tr>`}
function fmtD(d){if(!d)return'—';const[y,m,g]=d.split('-');return `${g}/${m}/${y}`}
function exportData(){const blob=new Blob([JSON.stringify({immobili,vendite,leads,annunci,aste,agenda,omi},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='casabusto-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);immobili=d.immobili||immobili;vendite=d.vendite||vendite;leads=d.leads||leads;annunci=d.annunci||annunci;aste=d.aste||aste;agenda=d.agenda||agenda;omi=d.omi||omi;persist();render();alert('Backup importato!')}catch(err){alert('File non valido')}};r.readAsText(f);}

function exportCSV(){
  const head=['tipo','zona','indirizzo','mq','prezzo','stato','note'];
  const rows=immobili.map(i=>[i.tipo,i.zona,i.ind||'',i.mq,i.prezzo,i.stato,(i.note||'').replace(/[\n;]/g,' ')]);
  const csv=[head.join(';'),...rows.map(r=>r.join(';'))].join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='immobili-busto.csv';a.click();
}
function importCSV(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{
    const lines=r.result.replace(/\ufeff/,'').split(/\r?\n/).filter(l=>l.trim());
    const sep=lines[0].includes(';')?';':',';
    const head=lines[0].split(sep).map(h=>h.trim().toLowerCase());
    const idx=n=>head.findIndex(h=>h.includes(n));
    const iT=idx('tipo'),iZ=idx('zona'),iI=idx('indiriz'),iM=idx('mq'),iP=idx('prezzo'),iS=idx('stato'),iN=idx('note');
    let n=0;
    lines.slice(1).forEach(l=>{const c=l.split(sep);
      if(!c[iT>=0?iT:0])return;
      const zonaRaw=(c[iZ]||'').trim();
      const zona=ZONE.find(z=>z.n.toLowerCase()===zonaRaw.toLowerCase())?zonaRaw:(ZONE.find(z=>zonaRaw.toLowerCase().includes(z.n.toLowerCase()))||{}).n||'Centro';
      immobili.push({id:uid(),tipo:(c[iT]||'').trim()||'Immobile',zona,ind:iI>=0?(c[iI]||'').trim():'',
        mq:+(c[iM]||'').replace(/\D/g,'')||0,prezzo:+(c[iP]||'').replace(/\D/g,'')||0,
        stato:iS>=0&&['acq','mandato','tratt'].includes((c[iS]||'').trim())?(c[iS]).trim():'acq',
        note:iN>=0?(c[iN]||'').trim():''});n++;});
    persist();render();alert(n+' immobili importati dal CSV!');
  }catch(err){alert('Errore lettura CSV. Controlla che le colonne siano: tipo, zona, indirizzo, mq, prezzo, stato, note')}};
  r.readAsText(f);}

/* Controlla se WebGL è disponibile nel browser corrente */
function checkWebGL(){
  try{
    const c=document.createElement('canvas');
    return !!(c.getContext('webgl2')||c.getContext('webgl')||c.getContext('experimental-webgl'));
  }catch(e){return false;}
}

function _init3D(){
  const container=document.getElementById('map3d');
  if(!container)return;

  // --- Riutilizza mappa 3D già inizializzata ---
  if(map3dObj){
    try{
      const canvas=map3dObj.getCanvas();
      if(canvas&&document.body.contains(canvas)){
        map3dObj.resize();
        const ldr=document.getElementById('map3dLoading');
        if(ldr){ldr.style.opacity='0';setTimeout(()=>{if(ldr.parentNode)ldr.style.display='none';},580);}
        return;
      }
    }catch(e){}
    try{map3dObj.remove();}catch(e){}
    map3dObj=null;map3dReady=false;
  }

  // --- Riutilizza mappa 2D Leaflet già inizializzata ---
  if(map2dFallback){
    try{
      const c=map2dFallback.getContainer();
      if(c&&document.body.contains(c)){
        map2dFallback.invalidateSize();
        const ldr=document.getElementById('map3dLoading');
        if(ldr){ldr.style.opacity='0';setTimeout(()=>{if(ldr.parentNode)ldr.style.display='none';},580);}
        return;
      }
    }catch(e){}
    try{map2dFallback.remove();}catch(e){}
    map2dFallback=null;
  }

  // --- Controlla WebGL PRIMA di inizializzare MapLibre ---
  if(!checkWebGL()){
    console.warn('[3D] WebGL non disponibile → fallback Leaflet 2D');
    _initLeaflet2D(container);
    return;
  }

  // --- Crea mappa MapLibre 3D ---
  requestAnimationFrame(()=>{
    if(!document.getElementById('map3d'))return; // utente ha navigato via
    try{
      map3dObj=new maplibregl.Map({
        container:'map3d',
        style:'https://tiles.openfreemap.org/styles/bright',
        center:[8.851,45.611],zoom:14.3,pitch:54,bearing:-17,antialias:true,
        maxZoom:19,minZoom:10
      });
    }catch(e){
      console.error('[3D] init error:',e);
      const ldr=document.getElementById('map3dLoading');
      if(ldr){ldr.innerHTML=`<div style="color:#c88;text-align:center;padding:24px;font-size:14px">⚠️ Errore mappa:<br>${e.message}</div>`;ldr.style.pointerEvents='all';}
      return;
    }

    map3dObj.addControl(new maplibregl.NavigationControl({showCompass:true}),'top-right');
    map3dObj.addControl(new maplibregl.ScaleControl({maxWidth:100,unit:'metric'}),'bottom-left');

    map3dObj.on('error',e=>console.warn('[MapLibre]',e.error?.message||e));

    // Timeout di sicurezza: 20 s
    const _t3d=setTimeout(()=>{
      if(!map3dReady){
        const ldr=document.getElementById('map3dLoading');
        if(ldr){
          ldr.style.background='linear-gradient(135deg,#1a0e0e,#2d1515)';
          ldr.style.pointerEvents='all';
          ldr.innerHTML=`<div style="text-align:center;padding:24px">
            <div style="font-size:30px;margin-bottom:10px">⚠️</div>
            <div style="color:#e0b0a0;font-size:14px;font-weight:600">Timeout caricamento mappa</div>
            <div style="color:#8a7070;font-size:12.5px;margin-top:8px;line-height:1.5">Controlla la connessione internet</div>
            <button onclick="try{map3dObj.remove();}catch(e){} map3dObj=null;map3dReady=false;render();" style="margin-top:16px;background:#c0572b;color:#fff;border:none;padding:9px 20px;border-radius:8px;cursor:pointer;font-size:13px">↺ Riprova</button>
          </div>`;
        }
      }
    },20000);

    map3dObj.on('load',()=>{
      clearTimeout(_t3d);
      map3dReady=true;

      // Nascondi spinner con fade
      const ldr=document.getElementById('map3dLoading');
      if(ldr){ldr.style.opacity='0';setTimeout(()=>{if(ldr.parentNode)ldr.style.display='none';},580);}

      // --- Rileva source vettoriale ---
      const styleDef=map3dObj.getStyle();
      const sources=styleDef.sources||{};
      let vecSrc=null;
      for(const[id,s]of Object.entries(sources)){if(s.type==='vector'){vecSrc=id;break;}}
      const firstLabel=styleDef.layers?.find(l=>l.type==='symbol'&&(l.layout?.['text-field']||l.layout?.['icon-image']))?.id;
      console.log('[3D] vecSrc:',vecSrc,'| firstLabel:',firstLabel,'| sources:',Object.keys(sources));

      // --- Edifici 3D ---
      if(vecSrc){
        try{
          // FIX CRITICO: NON usare interpolazione zoom sull'altezza → edifici invisibili a zoom 14
          // Invece: altezza piena subito, fade-in con opacità (visibili da zoom 13)
          const hExpr=['coalesce',['get','render_height'],['get','height'],8];
          const bExpr=['coalesce',['get','render_min_height'],['get','min_height'],0];
          if(map3dObj.getLayer('3d-buildings'))map3dObj.removeLayer('3d-buildings');
          map3dObj.addLayer({
            id:'3d-buildings',source:vecSrc,'source-layer':'building',
            type:'fill-extrusion',minzoom:12,
            paint:{
              'fill-extrusion-color':['interpolate',['linear'],
                ['coalesce',['get','render_height'],['get','height'],3],
                0,'#eeead4',5,'#e4dfd0',10,'#d8d3ca',20,'#cbc6bc',40,'#bcb8b0'],
              // ALTEZZA: diretta, senza zoom-interpolation (era il bug principale)
              'fill-extrusion-height': hExpr,
              'fill-extrusion-base': bExpr,
              // OPACITÀ: fade-in tra zoom 12 e 13.5 → pienamente visibili a zoom 14
              'fill-extrusion-opacity':['interpolate',['linear'],['zoom'],12,0,13.5,0.88]
            }
          },firstLabel);
          console.log('[3D] layer edifici aggiunto correttamente');
        }catch(e){console.warn('[3D] edifici:',e.message);}
      }else{
        console.warn('[3D] Nessuna source vettoriale trovata');
      }

      // --- Catasto WMS ---
      try{
        if(!map3dObj.getSource('catasto')){
          map3dObj.addSource('catasto',{type:'raster',
            tiles:['/api/catasto-tile?bbox={bbox-epsg-3857}'],
            tileSize:256,attribution:'© Agenzia delle Entrate CC-BY 4.0'});
          map3dObj.addLayer({id:'catasto-layer',type:'raster',source:'catasto',
            paint:{'raster-opacity':0.55},layout:{visibility:'none'}});
        }
      }catch(e){console.warn('[catasto]',e.message);}

      // --- Marker zone OMI ---
      ZONE.forEach(z=>{
        const v=omi[z.n]||1500;
        const col=v>1900?'#bf5628':v>1700?'#b5820a':'#4d6844';
        const el=document.createElement('div');
        el.innerHTML=`<div style="background:${col};color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.32);cursor:pointer;border:1.5px solid rgba(255,255,255,.18)">${v}€</div>`;
        new maplibregl.Marker({element:el,anchor:'bottom'})
          .setLngLat([z.lng,z.lat])
          .setPopup(new maplibregl.Popup({offset:28,maxWidth:'200px'})
            .setHTML(`<b style="font-family:'Fraunces',serif;font-size:14px">${z.n}</b><br><span style="font-size:12px;color:#666">OMI: <b>${v} €/mq</b></span>`))
          .addTo(map3dObj);
      });

      // --- Marker immobili in portafoglio ---
      const colMap={acq:'#4d6844',mandato:'#c0572b',tratt:'#b5820a',vend:'#3b7347'};
      const statoLabel={acq:'Acquisito',mandato:'In mandato',tratt:'In trattativa',vend:'Venduto'};
      immobili.forEach(imm=>{
        const z=zoneOf(imm.zona);
        const jit=()=>(Math.random()-.5)*0.004;
        const el=document.createElement('div');
        el.style.cssText=`width:13px;height:13px;border-radius:50%;background:${colMap[imm.stato]||'#888'};border:2.5px solid #fff;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.45);transition:transform .15s`;
        el.onmouseenter=()=>el.style.transform='scale(1.4)';
        el.onmouseleave=()=>el.style.transform='scale(1)';
        new maplibregl.Marker({element:el})
          .setLngLat([z.lng+jit(),z.lat+jit()])
          .setPopup(new maplibregl.Popup({offset:14,maxWidth:'230px'})
            .setHTML(`<div style="font-family:system-ui,sans-serif;font-size:13px;padding:2px">
              <b>${imm.tipo}</b> · <span style="color:#888">${imm.zona}</span>
              ${imm.ind?`<div style="color:#aaa;font-size:11px;margin-top:1px">${imm.ind}</div>`:''}
              <div style="margin-top:5px"><b style="font-size:15px;color:#c0572b">${eur(imm.prezzo)}</b> · <span style="color:#666">${imm.mq} mq</span></div>
              <div style="font-size:11px;color:#999;margin-top:2px">${statoLabel[imm.stato]||imm.stato}</div>
            </div>`))
          .addTo(map3dObj);
      });
    });
  });
}
/* ---- Fallback Leaflet 2D quando WebGL non è disponibile ---- */

    ldr.innerHTML=`<div class="m3d-spin"></div>
      <div style="color:#b8b0a8;font-size:13px;margin-top:4px">Caricamento mappa 2D…</div>
      <div style="color:#c8a010;font-size:11.5px;margin-top:6px">⚠️ WebGL non disponibile su questo browser</div>`;
  }
  requestAnimationFrame(()=>{
    if(!document.getElementById('map3d'))return;
    try{
      // Stile Leaflet più raffinato con CARTO tiles
      map2dFallback=L.map('map3d',{center:[45.611,8.851],zoom:14,zoomControl:false,attributionControl:true});
      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
        attribution:'&copy; <a href="https://carto.com/">CARTO</a> &copy; OSM',
        subdomains:'abcd',maxZoom:19
      }).addTo(map2dFallback);
      L.control.zoom({position:'topright'}).addTo(map2dFallback);
      L.control.scale({imperial:false,maxWidth:100}).addTo(map2dFallback);

      // Nascondi spinner
      if(ldr){ldr.style.opacity='0';setTimeout(()=>{if(ldr.parentNode)ldr.style.display='none';},580);}

      // Banner avviso WebGL
      const wrap=container.parentNode;
      if(wrap&&!document.getElementById('_wglBanner')){
        const banner=document.createElement('div');
        banner.id='_wglBanner';
        banner.style.cssText='position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(255,245,180,.96);border:1px solid #c8a010;border-radius:8px;padding:7px 14px;font-size:12px;color:#7a5c10;z-index:1000;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.18);pointer-events:auto;cursor:default';
        banner.innerHTML='⚠️ Vista 3D non disponibile — WebGL disabilitato nel browser. <a href="https://support.google.com/chrome/answer/1220892" target="_blank" style="color:#4a3a00;font-weight:700">Come abilitarlo ↗</a>';
        wrap.style.position='relative';
        wrap.appendChild(banner);
      }

      // Marker zone OMI
      ZONE.forEach(z=>{
        const v=omi[z.n]||1500;
        const col=v>1900?'#bf5628':v>1700?'#b5820a':'#4d6844';
        const icon=L.divIcon({

      immobili.forEach(imm=>{
        const z=zoneOf(imm.zona);

        const col=colMap[imm.stato]||'#888';
        const icon=L.divIcon({
          html:`<div style="width:13px;height:13px;border-radius:50%;background:${col};border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45);cursor:pointer"></div>`,

        });
        L.marker([z.lat+jit(),z.lng+jit()],{icon})

            <div style="margin-top:5px"><b style="font-size:15px;color:#c0572b">${eur(imm.prezzo)}</b> · <span style="color:#666">${imm.mq} mq</span></div>

    }catch(e){
      console.error('[2D] Leaflet fallback error:',e);
      if(ldr){
        ldr.style.cssText='display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;opacity:1;pointer-events:all;background:linear-gradient(135deg,#1a0e0e,#2d1515)';
        ldr.innerHTML=`<div style="font-size:28px">⚠️</div>

          <a href="https://support.google.com/chrome/answer/1220892" target="_blank" style="background:#c0572b;color:#fff;padding:9px 18px;border-radius:8px;text-decoration:none;font-size:13px;font-weight:600">Come abilitare WebGL ↗</a>`;
      }
    }

}

function toggleCatastoLayer(show){
  // Modalità 3D (MapLibre)
  if(map3dObj&&map3dReady){
    try{
      if(map3dObj.getLayer('catasto-layer'))
        map3dObj.setLayoutProperty('catasto-layer','visibility',show?'visible':'none');
    }catch(e){console.warn('[catasto]',e.message);}
    return;
  }
  // Modalità 2D (Leaflet) — catasto via proxy
  if(map2dFallback){
    if(show){
      if(!window._catasto2D){
        // Crea WMS layer usando tile proxy (convertiamo bbox da Leaflet → EPSG:3857)
        window._catasto2D=L.tileLayer(
          '/api/catasto-tile?bbox={bbox}',
          {opacity:0.55,attribution:'© Agenzia Entrate',
           // Leaflet non supporta {bbox-epsg-3857} nativamente → usiamo custom
           tileSize:256}
        );
        // Override per passare bbox corretto
        window._catasto2D.getTileUrl=function(coords){
          const b=this._tileCoordsToBounds(coords);
          const toM=p=>L.CRS.EPSG3857.project(p);
          const sw=toM(b.getSouthWest()), ne=toM(b.getNorthEast());
          return `/api/catasto-tile?bbox=${sw.x},${sw.y},${ne.x},${ne.y}`;
        };
      }
      window._catasto2D.addTo(map2dFallback);
    }else{
      if(window._catasto2D)map2dFallback.removeLayer(window._catasto2D);
    }
  }
}

/* ================================================================
   LEAD SCORING — algoritmo automatico 0-100
   ================================================================ */
function leadScore(lead){
  let s=40;
  const v=omi[lead.zona]||1500;
  s+=v>1900?18:v>1700?12:v>1500?6:0;
  s+=({Referral:18,Passaparola:16,Cartello:12,Sopralluogo:14,Web:6}[lead.fonte]||4);
  s+=({valutazione:20,mandato:30}[lead.fase]||0);
  if(lead.createdAt){
    const gg=Math.floor((Date.now()-new Date(lead.createdAt))/86400000);
    if(gg>60&&lead.fase==='valutazione')s-=20;
    else if(gg>30&&lead.fase==='valutazione')s-=10;
    else if(gg<5)s+=8;
  }
  return Math.max(0,Math.min(100,Math.round(s)));
}
function scoreColor(s){return s>=70?'var(--ok)':s>=45?'var(--warn)':'var(--terra)';}
function suggerisciAzione(lead){
  const gg=lead.createdAt?Math.floor((Date.now()-new Date(lead.createdAt))/86400000):0;
  if(lead.fase==='valutazione'&&gg>21)return'⚠️ Fermo da '+gg+' giorni — richiama!';
  if(lead.fase==='valutazione')return'✍️ Proponi il mandato';
  if(lead.fase==='mandato')return'🏠 Avvia il piano di vendita';
  return'📋 Aggiorna stato';
}

function pianoAzione(analisi){
  const urgenti=leads.filter(l=>leadScore(l)<45&&l.fase==='valutazione');
  const valutazioni=leads.filter(l=>l.fase==='valutazione');
  const top=analisi[0];
  let piano=`<b>Priorità settimana</b><br>`;
  if(urgenti.length)piano+=`Riattiva ${urgenti.length} lead fermi: ${urgenti.slice(0,3).map(l=>l.nome).join(', ')}${urgenti.length>3?'…':''}.<br><br>`;
  else piano+=`Tutti i lead sono attivi — ottimo!<br><br>`;
  piano+=`<b>Conversione</b><br>`;
  if(valutazioni.length)piano+=`${valutazioni.length} lead in valutazione da portare al mandato: ${valutazioni.map(l=>l.nome).join(', ')}.<br><br>`;
  const _appuntamenti_placeholder=[];//legacy
  if(_appuntamenti_placeholder.length)piano+=``;
  else piano+=`Nessun appuntamento in agenda, prospecta nuovi contatti.<br><br>`;
  piano+=`<b>Giovedì — Valutazioni</b><br>`;
  if(valutazioni.length)piano+=`Prepara le valutazioni scritte per: ${valutazioni.map(l=>l.nome).join(', ')}.<br><br>`;
  else piano+=`Nessuna valutazione pendente.<br><br>`;
  piano+=`<b>Venerdì — Prospecting</b><br>Concentrati su <b>${top.n}</b> (punteggio ${top.oppScore}): distribuisci volantini o chiama proprietari della zona.`;
  return piano;
}

async function uploadFotoIncarico(id,input){
  const imm=immobili.find(i=>i.id===id);
  if(!imm)return;
  if(!imm.foto)imm.foto=[];
  const files=[...input.files];
  for(const file of files){
    await new Promise(res=>{
      // Comprimi prima di salvare
      const img=new Image();
      const url=URL.createObjectURL(file);
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        const maxW=1200;
        const ratio=Math.min(maxW/img.width,1);
        canvas.width=Math.round(img.width*ratio);
        canvas.height=Math.round(img.height*ratio);
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        imm.foto.push(canvas.toDataURL('image/jpeg',0.78));
        URL.revokeObjectURL(url);
        res();
      };
      img.src=url;
    });
  }
  persist();
  // Aggiorna strip foto senza ridisegnare tutto
  const strip=document.getElementById('fstrip_'+id);
  if(strip) strip.innerHTML=imm.foto.map(f=>`<img src="${f}" style="width:100%;height:60px;object-fit:cover;border-radius:6px">`).join('');
}

async function analizzaConAI(id){
  const imm=immobili.find(i=>i.id===id);
  if(!imm)return;
  if(!(imm.foto||[]).length){
    openM(`<h2>📷 Foto richieste</h2>
      <p style="color:var(--muted);font-size:14px">Carica almeno una foto dell'immobile prima di avviare l'analisi AI.</p>
      <div class="modal-foot"><button class="btn btn-g" onclick="closeM()">OK</button></div>`);
    return;
  }
  openM(`<div style="text-align:center;padding:32px 20px">
    <div style="font-size:48px;margin-bottom:16px">🤖</div>
    <h2>Analisi AI in corso…</h2>
    <p style="color:var(--muted);font-size:14px;line-height:1.6">Analisi di <b>${imm.foto.length} foto</b> con Claude AI.<br>Elaborazione: 20-40 secondi.</p>
    <div style="margin-top:20px;background:var(--paper);border-radius:10px;padding:12px;font-size:12.5px;color:var(--slate)">
      ${imm.tipo} · ${imm.zona} · ${imm.mq} mq · ${eur(imm.prezzo)}
    </div>
  </div>`);
  try{
    const immagini=imm.foto.map(f=>({
      mime:f.split(';')[0].split(':')[1]||'image/jpeg',
      data:f.split(',')[1]
    }));
    const r=await fetch('/api/analizza-foto',{
      method:'POST',credentials:'same-origin',
      headers:{...authHeaders(),'Content-Type':'application/json'},
      body:JSON.stringify({immagini,zona:imm.zona,mq:imm.mq,tipo:imm.tipo,
        prezzoRichiesto:imm.prezzo,note:imm.note||''})
    });
    if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||'Errore '+r.status);}
    const d=await r.json();
    imm.aiAnalisi=d.analisi;
    persist();
    showAIResultsModal(imm,d.analisi);
    // Ricarica la card aggiornata
    setTimeout(()=>vIncarichi(),100);
  }catch(e){
    const isConfig=e.message.includes('ANTHROPIC_API_KEY')||e.message.includes('non attiva');
    openM(`<h2>⚠️ Errore analisi</h2>
      <p style="color:var(--terra);font-size:14px">${e.message}</p>
      ${isConfig?`<div class="note" style="margin-top:14px">
        Per attivare l'analisi AI aggiungi <b>ANTHROPIC_API_KEY=sk-ant-...</b> nel file <b>.env</b> e riavvia il server.<br>
        Ottieni la chiave su <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a>
      </div>`:''}
      <div class="modal-foot"><button class="btn btn-g" onclick="closeM()">Chiudi</button></div>`);
  }
}

function showAIResultsModal(imm,a){
  if(!a){openM(`<h2>Errore</h2><p>Dati non disponibili.</p><div class="modal-foot"><button class="btn btn-g" onclick="closeM()">Chiudi</button></div>`);return;}
  if(a.error&&!a.stima_valore){
    openM(`<h2>Analisi parziale</h2><pre style="font-size:11px;overflow:auto;max-height:300px">${a.raw||a.error}</pre>
      <div class="modal-foot"><button class="btn btn-g" onclick="closeM()">Chiudi</button></div>`);
    return;
  }
  const voto=a.stato_conservativo?.voto||5;
  const vendib=a.vendibilita?.percentuale||0;
  const fuori=a.analisi_prezzo?.fuori_prezzo_percentuale||0;
  const dir=a.analisi_prezzo?.direzione||'allineato';
  const stima=a.stima_valore?.totale_stimato||0;
  const consigliato=a.analisi_prezzo?.prezzo_consigliato||stima;
  openM(`
    <div style="max-height:82vh;overflow-y:auto;padding-right:4px">
      <h2 style="margin-bottom:16px">🤖 Analisi AI — ${imm.tipo} · ${imm.zona}</h2>
      <div class="grid g3" style="margin-bottom:16px;gap:10px">
        <div style="background:${voto>=7?'var(--ok-l)':voto>=5?'var(--warn-l)':'var(--terra-l)'};border-radius:12px;padding:14px;text-align:center">
          <div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.08em">Stato conservativo</div>
          <div style="font-family:'Fraunces',serif;font-size:40px;font-weight:600;color:${voto>=7?'var(--ok)':voto>=5?'var(--warn)':'var(--terra)'};margin:6px 0">${voto}<span style="font-size:20px">/10</span></div>
          <div style="font-size:11.5px;color:var(--muted)">${a.classe_qualitativa||''}</div>
        </div>
        <div style="background:${vendib>=70?'var(--ok-l)':vendib>=40?'var(--warn-l)':'var(--terra-l)'};border-radius:12px;padding:14px;text-align:center">
          <div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.08em">Vendibilità</div>
          <div style="font-family:'Fraunces',serif;font-size:40px;font-weight:600;color:${vendib>=70?'var(--ok)':vendib>=40?'var(--warn)':'var(--terra)'};margin:6px 0">${vendib}%</div>
          <div style="font-size:11.5px;color:var(--muted)">${a.vendibilita?.tempo_stimato_vendita||''}</div>
        </div>
        <div style="background:${dir==='allineato'?'var(--ok-l)':'var(--terra-l)'};border-radius:12px;padding:14px;text-align:center">
          <div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.08em">Fuori prezzo</div>
          <div style="font-family:'Fraunces',serif;font-size:40px;font-weight:600;color:${dir==='allineato'?'var(--ok)':'var(--terra)'};margin:6px 0">${dir==='sopra'?'+':''}${fuori}%</div>
          <div style="font-size:11.5px;color:var(--muted)">${dir} mercato</div>
        </div>
      </div>
      <!-- Stima valore -->
      <div class="card" style="text-align:center;margin-bottom:14px;padding:18px">
        <div style="font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700">Valore di mercato stimato AI</div>
        <div style="font-family:'Fraunces',serif;font-size:38px;font-weight:600;color:var(--terra);margin:8px 0">${eur(stima)}</div>
        <div style="font-size:13px;color:var(--slate)">${a.stima_valore?.euro_al_mq||0} €/mq · ${a.stima_valore?.motivazione||''}</div>
        ${consigliato&&consigliato!==stima?`<div style="font-size:13.5px;margin-top:8px;color:var(--ok);font-weight:600">Prezzo consigliato: ${eur(consigliato)}</div>`:''}
        ${imm.prezzo?`<div style="font-size:12px;color:var(--muted);margin-top:4px">Prezzo richiesto: ${eur(imm.prezzo)} → scostamento: ${Math.round((imm.prezzo-stima)/stima*100)>0?'+':''}${Math.round((imm.prezzo-stima)/stima*100)}%</div>`:''}
      </div>
      <!-- Punti forza e criticità -->
      <div class="grid g2" style="margin-bottom:14px;gap:10px">
        <div class="card" style="padding:14px">
          <div style="font-weight:700;margin-bottom:8px;color:var(--ok)">✓ Punti di forza</div>
          ${(a.punti_forza||[]).map(p=>`<div style="font-size:13px;padding:4px 0;border-bottom:1px solid var(--line);color:var(--slate)">+ ${p}</div>`).join('')||'<div style="color:var(--muted);font-size:13px">—</div>'}
        </div>
        <div class="card" style="padding:14px">
          <div style="font-weight:700;margin-bottom:8px;color:var(--terra)">✗ Criticità</div>
          ${(a.criticita||[]).map(c=>`<div style="font-size:13px;padding:4px 0;border-bottom:1px solid var(--line);color:var(--slate)">− ${c}</div>`).join('')||'<div style="color:var(--muted);font-size:13px">—</div>'}
        </div>
      </div>
      <!-- Piano azione -->
      ${a.piano_azione?`<div class="note"><b>Piano d'azione consigliato:</b> ${a.piano_azione}</div>`:''}
      <!-- Descrizione vendibilità -->
      ${a.vendibilita?.spiegazione?`<div style="background:var(--paper);border-radius:10px;padding:12px;border:1px solid var(--line);font-size:12.5px;line-height:1.6;color:var(--slate);margin-top:12px"><b>Analisi vendibilità:</b> ${a.vendibilita.spiegazione}</div>`:''}
      ${a.analisi_prezzo?.nota?`<div style="background:var(--paper);border-radius:10px;padding:12px;border:1px solid var(--line);font-size:12.5px;line-height:1.6;color:var(--slate);margin-top:10px"><b>Posizionamento prezzo:</b> ${a.analisi_prezzo.nota}</div>`:''}
      <div class="modal-foot">
        <button class="btn btn-g" onclick="closeM()">Chiudi</button>
      </div>
    </div>`);
}

/* ---------- MENU HAMBURGER ---------- */
let _menuOpen=false;
function toggleMenu(){
  _menuOpen=!_menuOpen;
  document.getElementById('side').classList.toggle('open',_menuOpen);
  document.getElementById('sideOv').classList.toggle('show',_menuOpen);
}
function closeMenu(){
  _menuOpen=false;
  document.getElementById('side').classList.remove('open');
  document.getElementById('sideOv').classList.remove('show');
}

/* ---------- LOGIN / SESSIONE ---------- */
let APP_TOKEN = sessionStorage.getItem('cb_token') || null;
function authHeaders(extra){
  const h=Object.assign({},extra||{});
  if(APP_TOKEN) h['X-App-Token']=APP_TOKEN;
  return h;
}
async function checkSession(){
  try{
    const r=await fetch('/api/me',{credentials:'same-origin',headers:authHeaders()});
    const d=await r.json();
    if(d.authed){ showApp(true); } else { showLogin(); }
  }catch(e){
    showLogin();
    document.getElementById('lg_err').textContent='Server non raggiungibile.';
  }
}
function showLogin(){
  document.getElementById('loginOverlay').style.cssText='display:flex;opacity:1;transform:scale(1)';
  document.getElementById('appRoot').style.display='none';
  setTimeout(()=>{const p=document.getElementById('lg_pass');if(p)p.focus();},100);
}
function showApp(instant){
  const overlay=document.getElementById('loginOverlay');
  const root=document.getElementById('appRoot');
  cur='mappa3d'; updateNav();
  if(instant){
    overlay.style.display='none';
    root.style.display='block';
    render();
    return;
  }
  // Animazione: la mappa 3D parte in background mentre il login svanisce
  root.style.cssText='display:block;opacity:0';
  render(); // avvia caricamento mappa in background
  // Fade out login
  overlay.style.transition='opacity .55s ease,transform .55s ease';
  overlay.style.opacity='0';
  overlay.style.transform='scale(1.06)';
  setTimeout(()=>{
    overlay.style.display='none';
    root.style.transition='opacity .4s ease';
    root.style.opacity='1';
  },520);
}
async function doLogin(){
  const user=document.getElementById('lg_user').value.trim();
  const pass=document.getElementById('lg_pass').value;
  const err=document.getElementById('lg_err');
  const btn=document.querySelector('#loginOverlay button.btn-p');
  err.textContent='';
  if(btn){btn.disabled=true;btn.textContent='Accesso…';}
  try{
    const r=await fetch('/api/login',{method:'POST',credentials:'same-origin',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user,password:pass})});
    if(r.ok){
      const d=await r.json().catch(()=>({}));
      if(d.token){APP_TOKEN=d.token;sessionStorage.setItem('cb_token',d.token);}
      document.getElementById('lg_pass').value='';
      showApp(false);
    } else {
      const d=await r.json().catch(()=>({}));
      err.textContent=d.error==='credenziali non valide'?'Nome utente o password errati.':'Accesso non riuscito.';
      if(btn){btn.disabled=false;btn.textContent='Entra';}
    }
  }catch(e){
    err.textContent='Server non raggiungibile.';
    if(btn){btn.disabled=false;btn.textContent='Entra';}
  }
}
async function doLogout(){
  try{await fetch('/api/logout',{method:'POST',credentials:'same-origin',headers:authHeaders()});}catch(e){}
  APP_TOKEN=null; sessionStorage.removeItem('cb_token'); showLogin();
}

checkSession();
